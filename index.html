<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Relay Test Scene</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #222;
            color: white;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
            z-index: 100;
        }
        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background-color: rgba(255, 0, 0, 0.7);
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            max-width: 80%;
            z-index: 200;
            display: none;
        }
        #canvas-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        /* Stereoscopic view styling */
        .stereo-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .eye-view {
            width: 50%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="info">Initializing...</div>
    <div id="error-message"></div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Global variables
        let scene, renderer;
        let desktopCamera, leftEyeCamera, rightEyeCamera;
        let controls;
        let isDesktop = false;
        let isPaired = false;
        let pairedClientId = null;
        let room;
        let clock = new THREE.Clock();
        let EYE_SEPARATION = 0.064; // ~6.4cm between eyes
        let lastCameraUpdate = { position: new THREE.Vector3(), quaternion: new THREE.Quaternion() };
        let lastSentTime = null;
        
        // Check for WebGL support
        function checkWebGLSupport() {
            try {
                const canvas = document.createElement('canvas');
                return !!(window.WebGLRenderingContext && 
                    (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
            } catch (e) {
                return false;
            }
        }
        
        // Display error message
        function showError(message) {
            const errorElement = document.getElementById('error-message');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            updateInfo('Error: ' + message);
            console.error(message);
        }
        
        // Initialize
        async function init() {
            try {
                // Check WebGL support first
                if (!checkWebGLSupport()) {
                    throw new Error('WebGL is not supported by your browser or device.');
                }
                
                // Device detection
                isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
                updateInfo(`Device type: ${isDesktop ? 'Desktop' : 'Mobile'}`);

                // Initialize WebSocket connection
                room = new WebsimSocket();
                await room.initialize();
                updateInfo(`Connected as: ${room.peers[room.clientId].username}`);

                // Initialize presence
                room.updatePresence({
                    deviceType: isDesktop ? 'desktop' : 'mobile',
                    username: room.peers[room.clientId].username,
                    paired: false
                });

                // Set up the scene
                createScene();

                // Set up controls/rendering based on device type
                if (isDesktop) {
                    setupDesktopView();
                } else {
                    setupMobileView();
                }

                // Subscribe to presence updates for pairing
                room.subscribePresence(handlePresenceUpdate);
                
                // Subscribe to presence update requests
                room.subscribePresenceUpdateRequests(handleUpdateRequest);
                
                // Handle messages
                room.onmessage = handleMessage;

                // Start animation loop
                animate();
            } catch (error) {
                showError(error.message || 'Failed to initialize 3D scene.');
            }
        }

        function createScene() {
            try {
                // Create scene
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87ceeb); // Sky blue
                
                // Create renderer with specific parameters
                const rendererParams = {
                    antialias: true,
                    powerPreference: 'default', // Can be 'high-performance', 'low-power', or 'default'
                    failIfMajorPerformanceCaveat: false
                };
                
                renderer = new THREE.WebGLRenderer(rendererParams);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio to improve performance
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.getElementById('canvas-container').appendChild(renderer.domElement);
                
                // Add lighting
                const ambientLight = new THREE.AmbientLight(0x404040);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(1, 1, 1);
                scene.add(directionalLight);
                
                // Create infinite grass plane
                const planeGeometry = new THREE.PlaneGeometry(1000, 1000);
                const grassTexture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
                grassTexture.wrapS = THREE.RepeatWrapping;
                grassTexture.wrapT = THREE.RepeatWrapping;
                grassTexture.repeat.set(100, 100);
                
                const planeMaterial = new THREE.MeshStandardMaterial({ 
                    map: grassTexture,
                    roughness: 0.8
                });
                
                const plane = new THREE.Mesh(planeGeometry, planeMaterial);
                plane.rotation.x = -Math.PI / 2;
                scene.add(plane);
                
                // Add some basic objects
                // Red cube
                const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
                const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
                const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
                cube.position.set(2, 0.5, -3);
                scene.add(cube);
                
                // Blue sphere
                const sphereGeometry = new THREE.SphereGeometry(0.7, 32, 16);
                const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x0088ff, metalness: 0.3 });
                const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
                sphere.position.set(-2, 0.7, -3);
                scene.add(sphere);
                
                // Green cylinder
                const cylinderGeometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
                const cylinderMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff44 });
                const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
                cylinder.position.set(0, 1, -6);
                scene.add(cylinder);
                
                // Yellow torus
                const torusGeometry = new THREE.TorusGeometry(0.7, 0.2, 16, 100);
                const torusMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
                const torus = new THREE.Mesh(torusGeometry, torusMaterial);
                torus.position.set(4, 1, -5);
                torus.rotation.x = Math.PI / 2;
                scene.add(torus);
                
                // Handle window resize
                window.addEventListener('resize', onWindowResize);
            } catch (error) {
                throw new Error('Error creating WebGL scene: ' + error.message);
            }
        }

        function setupDesktopView() {
            // Create desktop camera
            desktopCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            desktopCamera.position.set(0, 1.6, 0); // Eye height 1.6m
            
            // Add orbit controls
            controls = new OrbitControls(desktopCamera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
        }

        function setupMobileView() {
            // Request device orientation permission on iOS
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                document.body.addEventListener('click', async () => {
                    try {
                        const permission = await DeviceOrientationEvent.requestPermission();
                        if (permission === 'granted') {
                            setupGyroscope();
                        }
                    } catch (error) {
                        updateInfo("Error requesting gyroscope permission");
                    }
                }, { once: true });
                
                updateInfo("Tap screen to enable gyroscope");
            } else {
                setupGyroscope();
            }
            
            // Create stereoscopic containers
            const container = document.getElementById('canvas-container');
            container.innerHTML = '';
            container.classList.add('stereo-container');
            
            // Create left eye view
            const leftEyeView = document.createElement('div');
            leftEyeView.classList.add('eye-view');
            leftEyeView.id = 'left-eye';
            container.appendChild(leftEyeView);
            
            // Create right eye view
            const rightEyeView = document.createElement('div');
            rightEyeView.classList.add('eye-view');
            rightEyeView.id = 'right-eye';
            container.appendChild(rightEyeView);
            
            // Create cameras for stereoscopic view
            const aspect = (window.innerWidth / 2) / window.innerHeight;
            leftEyeCamera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
            rightEyeCamera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
            
            // Position cameras with eye separation
            leftEyeCamera.position.set(-EYE_SEPARATION / 2, 1.6, 0);
            rightEyeCamera.position.set(EYE_SEPARATION / 2, 1.6, 0);
        }

        function setupGyroscope() {
            window.addEventListener('deviceorientation', function(event) {
                if (room && pairedClientId) {
                    // Send gyro data to paired desktop
                    room.send({
                        type: 'gyroData',
                        alpha: event.alpha, // Z-axis rotation
                        beta: event.beta,   // X-axis rotation
                        gamma: event.gamma  // Y-axis rotation
                    });
                }
            });
            
            updateInfo("Gyroscope enabled");
        }

        function handlePresenceUpdate(presence) {
            // If I'm mobile and not paired, look for my desktop
            if (!isDesktop && !isPaired) {
                const myUsername = room.peers[room.clientId].username;
                
                for (const clientId in presence) {
                    if (clientId !== room.clientId && 
                        presence[clientId].deviceType === 'desktop' && 
                        presence[clientId].username === myUsername &&
                        !presence[clientId].paired) {
                        
                        // Found my desktop, request pairing
                        pairedClientId = clientId;
                        room.requestPresenceUpdate(clientId, {
                            type: 'requestPairing',
                            fromClientId: room.clientId
                        });
                        
                        // Update my presence
                        room.updatePresence({
                            paired: true,
                            pairedWith: clientId
                        });
                        
                        isPaired = true;
                        updateInfo(`Paired with my desktop: ${clientId}`);
                        break;
                    }
                }
            }
        }

        function handleUpdateRequest(request, fromClientId) {
            if (request.type === 'requestPairing' && isDesktop) {
                // Check if this is my mobile (same username)
                const requestingUsername = room.peers[fromClientId].username;
                const myUsername = room.peers[room.clientId].username;
                
                if (requestingUsername === myUsername) {
                    pairedClientId = fromClientId;
                    isPaired = true;
                    
                    // Update my presence
                    room.updatePresence({
                        paired: true,
                        pairedWith: fromClientId
                    });
                    
                    updateInfo(`Paired with my mobile: ${fromClientId}`);
                }
            }
        }

        function handleMessage(event) {
            const data = event.data;
            
            if (data.type === 'gyroData' && isDesktop && isPaired) {
                // Apply gyro data to desktop camera
                applyGyroToCamera(data.alpha, data.beta, data.gamma);
            }
            else if (data.type === 'cameraUpdate' && !isDesktop && isPaired) {
                // Update mobile cameras based on desktop camera
                updateMobileCameras(data.position, data.quaternion);
            }
        }

        function applyGyroToCamera(alpha, beta, gamma) {
            // Convert gyro data to camera rotation
            const euler = new THREE.Euler(
                THREE.MathUtils.degToRad(beta),   // x-axis (look up/down)
                THREE.MathUtils.degToRad(alpha),  // y-axis (turn left/right)
                THREE.MathUtils.degToRad(-gamma), // z-axis (tilt)
                'YXZ'
            );
            
            if (controls) {
                // Disable orbit controls while using gyro
                controls.enabled = false;
            }
            
            desktopCamera.quaternion.setFromEuler(euler);
        }

        function updateMobileCameras(position, quaternion) {
            // Convert position and quaternion from plain objects to THREE.js objects
            const posVector = new THREE.Vector3(position.x, position.y, position.z);
            const quatObj = new THREE.Quaternion(quaternion.x, quaternion.y, quaternion.z, quaternion.w);
            
            // Store the latest camera update
            lastCameraUpdate.position.copy(posVector);
            lastCameraUpdate.quaternion.copy(quatObj);
            
            // Update camera positions based on desktop camera
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(quatObj);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(quatObj);
            
            // Position left eye camera
            leftEyeCamera.position.copy(posVector);
            leftEyeCamera.position.sub(right.clone().multiplyScalar(EYE_SEPARATION / 2));
            leftEyeCamera.quaternion.copy(quatObj);
            
            // Position right eye camera
            right.set(1, 0, 0).applyQuaternion(quatObj);
            rightEyeCamera.position.copy(posVector);
            rightEyeCamera.position.add(right.multiplyScalar(EYE_SEPARATION / 2));
            rightEyeCamera.quaternion.copy(quatObj);
        }

        function animate() {
            try {
                requestAnimationFrame(animate);
                
                if (!renderer) return; // Skip if renderer is not initialized
                
                if (isDesktop) {
                    // Update controls if not using gyro
                    if (controls && controls.enabled) {
                        controls.update();
                    }
                    
                    // Render desktop view
                    renderer.render(scene, desktopCamera);
                    
                    // Send camera updates if paired
                    if (isPaired && pairedClientId) {
                        // Send camera updates at most 30 times per second
                        const now = clock.getElapsedTime();
                        if (!lastSentTime || now - lastSentTime > 0.033) { // ~30fps
                            const position = desktopCamera.position;
                            const quaternion = desktopCamera.quaternion;
                            
                            room.send({
                                type: 'cameraUpdate',
                                position: {
                                    x: position.x,
                                    y: position.y,
                                    z: position.z
                                },
                                quaternion: {
                                    x: quaternion.x,
                                    y: quaternion.y,
                                    z: quaternion.z,
                                    w: quaternion.w
                                }
                            });
                            
                            lastSentTime = now;
                        }
                    }
                } else {
                    // Render stereoscopic view
                    if (isPaired) {
                        // Set viewport for left eye
                        renderer.setViewport(0, 0, window.innerWidth / 2, window.innerHeight);
                        renderer.setScissor(0, 0, window.innerWidth / 2, window.innerHeight);
                        renderer.setScissorTest(true);
                        renderer.render(scene, leftEyeCamera);
                        
                        // Set viewport for right eye
                        renderer.setViewport(window.innerWidth / 2, 0, window.innerWidth / 2, window.innerHeight);
                        renderer.setScissor(window.innerWidth / 2, 0, window.innerWidth / 2, window.innerHeight);
                        renderer.setScissorTest(true);
                        renderer.render(scene, rightEyeCamera);
                    } else {
                        // Render single view when not paired
                        renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                        renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
                        renderer.setScissorTest(true);
                        
                        // Use left eye camera as default
                        renderer.render(scene, leftEyeCamera);
                    }
                }
            } catch (error) {
                console.error('Error in animation loop:', error);
                cancelAnimationFrame(animate);
                showError('Error in rendering: ' + error.message);
            }
        }

        function onWindowResize() {
            try {
                if (isDesktop) {
                    desktopCamera.aspect = window.innerWidth / window.innerHeight;
                    desktopCamera.updateProjectionMatrix();
                } else {
                    const aspect = (window.innerWidth / 2) / window.innerHeight;
                    leftEyeCamera.aspect = aspect;
                    rightEyeCamera.aspect = aspect;
                    leftEyeCamera.updateProjectionMatrix();
                    rightEyeCamera.updateProjectionMatrix();
                }
                
                renderer.setSize(window.innerWidth, window.innerHeight);
            } catch (error) {
                console.error('Error resizing window:', error);
            }
        }

        function updateInfo(message) {
            document.getElementById('info').innerText = message;
        }

        // Initialize application
        window.addEventListener('load', init);
    </script>
