<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Relay Test Scene</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background-color: rgba(0,0,0,0.5);
            padding: 5px;
            border-radius: 5px;
            z-index: 100;
        }
        #canvas-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        /* Stereoscopic view styling */
        .stereo-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .eye-view {
            width: 50%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="info">Initializing...</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Global variables
        let scene, renderer;
        let desktopCamera, leftEyeCamera, rightEyeCamera;
        let controls;
        let isDesktop = false;
        let isPaired = false;
        let pairedClientId = null;
        let room;
        let clock = new THREE.Clock();
        let EYE_SEPARATION = 0.064; // ~6.4cm between eyes
        let lastSentTime = null;

        // Initialize
        async function init() {
            // Device detection
            isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));
            updateInfo(`Device type: ${isDesktop ? 'Desktop' : 'Mobile'}`);

            // Initialize WebSocket connection
            room = new WebsimSocket();
            await room.initialize();
            updateInfo(`Connected as: ${room.peers[room.clientId].username} (${room.clientId.substring(0,4)})`);

            // Initialize presence
            room.updatePresence({
                deviceType: isDesktop ? 'desktop' : 'mobile',
                username: room.peers[room.clientId].username,
                paired: false,
                pairedWith: null
            });

            // Set up the scene
            createScene();

            // Set up controls/rendering based on device type
            if (isDesktop) {
                setupDesktopView();
            } else {
                setupMobileView();
            }

            // Subscribe to presence updates for pairing
            room.subscribePresence(handlePresenceUpdate);

            // Subscribe to presence update requests
            room.subscribePresenceUpdateRequests(handleUpdateRequest);

            // Handle messages
            room.onmessage = handleMessage;

            // Start animation loop
            animate();
        }

        function createScene() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue

            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Add lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            // Create infinite grass plane
            const planeGeometry = new THREE.PlaneGeometry(1000, 1000);
            const planeMaterial = new THREE.MeshStandardMaterial({
                color: 0x008800, // Green color
                roughness: 0.9,
                metalness: 0.1
            });

            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);

            // Add some basic objects
            // Red cube
            const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
            const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            cube.position.set(2, 0.5, -3);
            scene.add(cube);

            // Blue sphere
            const sphereGeometry = new THREE.SphereGeometry(0.7, 32, 16);
            const sphereMaterial = new THREE.MeshStandardMaterial({ color: 0x0088ff, metalness: 0.3 });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.set(-2, 0.7, -3);
            scene.add(sphere);

            // Green cylinder
            const cylinderGeometry = new THREE.CylinderGeometry(0.5, 0.5, 2, 32);
            const cylinderMaterial = new THREE.MeshStandardMaterial({ color: 0x00ff44 });
            const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
            cylinder.position.set(0, 1, -6);
            scene.add(cylinder);

            // Yellow torus
            const torusGeometry = new THREE.TorusGeometry(0.7, 0.2, 16, 100);
            const torusMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            const torus = new THREE.Mesh(torusGeometry, torusMaterial);
            torus.position.set(4, 1, -5);
            torus.rotation.x = Math.PI / 2;
            scene.add(torus);

            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }

        function setupDesktopView() {
            // Create desktop camera
            desktopCamera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            desktopCamera.position.set(0, 1.6, 3); // Start slightly back
            desktopCamera.lookAt(0, 1.6, 0);

            // Add orbit controls
            controls = new OrbitControls(desktopCamera, renderer.domElement);
            controls.target.set(0, 1.6, 0); // Look slightly above ground
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            updateInfo("Desktop view initialized. Use mouse to look around.");
        }

        function setupMobileView() {
            // Create stereoscopic containers
            const container = document.getElementById('canvas-container');
            container.innerHTML = ''; // Clear existing canvas if any
            container.classList.add('stereo-container');

            // Create left eye view
            const leftEyeView = document.createElement('div');
            leftEyeView.classList.add('eye-view');
            leftEyeView.id = 'left-eye';
            container.appendChild(leftEyeView);

            // Create right eye view
            const rightEyeView = document.createElement('div');
            rightEyeView.classList.add('eye-view');
            rightEyeView.id = 'right-eye';
            container.appendChild(rightEyeView);

            // Create cameras for stereoscopic view
            const aspect = (window.innerWidth / 2) / window.innerHeight;
            leftEyeCamera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
            rightEyeCamera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);

            // Position cameras with eye separation relative to a base position
            // Actual positions will be set by updateMobileCameras
            leftEyeCamera.position.set(-EYE_SEPARATION / 2, 1.6, 0);
            rightEyeCamera.position.set(EYE_SEPARATION / 2, 1.6, 0);
            updateInfo("Mobile view initialized. Waiting for desktop pairing...");
        }

        function handlePresenceUpdate(presence) {
            // If I'm mobile and not paired, look for my desktop
            if (!isDesktop && !isPaired) {
                const myUsername = room.peers[room.clientId].username;

                for (const clientId in presence) {
                    if (clientId !== room.clientId &&
                        presence[clientId].deviceType === 'desktop' &&
                        presence[clientId].username === myUsername &&
                        !presence[clientId].paired) { // Check if desktop is not already paired

                        console.log(`Found potential desktop pair: ${clientId}`);
                        // Found my desktop, request pairing
                        pairedClientId = clientId; // Tentatively set paired client
                        room.requestPresenceUpdate(clientId, {
                            type: 'requestPairing',
                            fromClientId: room.clientId,
                            username: myUsername // Send username for verification
                        });

                        // Don't set isPaired=true here yet. Wait for confirmation
                        // or check desktop presence state.
                        updateInfo(`Requesting pairing with desktop: ${clientId.substring(0,4)}`);
                        break; // Only try to pair with one desktop
                    }
                }
            }

            // Check if the desktop I requested pairing with has accepted
            if (!isDesktop && !isPaired && pairedClientId) {
                 const desktopPresence = presence[pairedClientId];
                 if (desktopPresence && desktopPresence.paired && desktopPresence.pairedWith === room.clientId) {
                     isPaired = true;
                     room.updatePresence({ // Confirm pairing on my side
                         paired: true,
                         pairedWith: pairedClientId
                     });
                     updateInfo(`Successfully paired with desktop: ${pairedClientId.substring(0,4)}`);
                     // Adjust renderer size for stereoscopic view now
                     onWindowResize();
                 }
            }

            // Check if my pair disconnected
            if (isPaired && pairedClientId && !presence[pairedClientId]) {
                console.log(`Paired device ${pairedClientId} disconnected.`);
                isPaired = false;
                pairedClientId = null;
                room.updatePresence({ paired: false, pairedWith: null });
                updateInfo(`Paired device disconnected. ${isDesktop ? 'Waiting for mobile.' : 'Waiting for desktop.'}`);
                if (!isDesktop) {
                     // Revert to single view rendering if pair disconnects
                     onWindowResize();
                }
            }
        }

        function handleUpdateRequest(request, fromClientId) {
            if (request.type === 'requestPairing' && isDesktop && !isPaired) {
                // Check if this is my mobile (same username)
                const requestingUsername = request.username; // Use username from request
                const myUsername = room.peers[room.clientId].username;

                if (requestingUsername === myUsername) {
                    console.log(`Received pairing request from mobile: ${fromClientId}`);
                    pairedClientId = fromClientId;
                    isPaired = true;

                    // Update my presence to confirm pairing
                    room.updatePresence({
                        paired: true,
                        pairedWith: fromClientId
                    });

                    updateInfo(`Paired with mobile: ${fromClientId.substring(0,4)}`);
                } else {
                    console.log(`Ignoring pairing request from ${fromClientId} (username mismatch: ${requestingUsername} vs ${myUsername})`);
                }
            }
        }

        function handleMessage(event) {
            const data = event.data;
            const fromClientId = data.clientId; // Client who sent the message

            // Mobile client receives camera updates from its paired desktop
            if (data.type === 'cameraUpdate' && !isDesktop && isPaired && fromClientId === pairedClientId) {
                updateMobileCameras(data.position, data.quaternion);
            }
            // Other message types can be handled here
        }

        function updateMobileCameras(position, quaternion) {
            // Convert position and quaternion from plain objects to THREE.js objects
            const posVector = new THREE.Vector3(position.x, position.y, position.z);
            const quatObj = new THREE.Quaternion(quaternion._x, quaternion._y, quaternion._z, quaternion._w); // Access internal properties if needed, or ensure it's serialized correctly

            // Calculate the 'right' vector based on the desktop camera's orientation
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(quatObj);

            // Position left eye camera: desktop position - half eye separation along right vector
            leftEyeCamera.position.copy(posVector).addScaledVector(right, -EYE_SEPARATION / 2);
            leftEyeCamera.quaternion.copy(quatObj); // Both eyes share the same orientation

            // Position right eye camera: desktop position + half eye separation along right vector
            rightEyeCamera.position.copy(posVector).addScaledVector(right, EYE_SEPARATION / 2);
            rightEyeCamera.quaternion.copy(quatObj);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isDesktop) {
                // Always update controls if they exist
                if (controls) {
                    controls.update();
                }

                // Render desktop view
                renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
                renderer.setScissorTest(false); // Disable scissor for full view
                renderer.render(scene, desktopCamera);

                // Send camera updates if paired
                if (isPaired && pairedClientId) {
                    const now = clock.getElapsedTime();
                     // Send camera updates at most ~30 times per second
                    if (!lastSentTime || now - lastSentTime > (1 / 30)) {
                        const position = desktopCamera.position;
                        const quaternion = desktopCamera.quaternion;

                        // Send update to the specific paired client
                        room.send({
                            type: 'cameraUpdate',
                            targetClientId: pairedClientId, // Include target for potential future filtering or server-side routing
                            position: { // Send plain objects
                                x: position.x,
                                y: position.y,
                                z: position.z
                            },
                            quaternion: {
                                _x: quaternion.x, // Ensure proper serialization if needed
                                _y: quaternion.y,
                                _z: quaternion.z,
                                _w: quaternion.w
                            }
                        });

                        lastSentTime = now;
                    }
                }
            } else { // Mobile view
                if (isPaired) {
                    // Render stereoscopic view only when paired
                    const halfWidth = window.innerWidth / 2;
                    const height = window.innerHeight;

                    // Set viewport for left eye
                    renderer.setViewport(0, 0, halfWidth, height);
                    renderer.setScissor(0, 0, halfWidth, height);
                    renderer.setScissorTest(true);
                    renderer.render(scene, leftEyeCamera);

                    // Set viewport for right eye
                    renderer.setViewport(halfWidth, 0, halfWidth, height);
                    renderer.setScissor(halfWidth, 0, halfWidth, height);
                    renderer.setScissorTest(true);
                    renderer.render(scene, rightEyeCamera);
                } else {
                     // Optionally, render a single-eye view or a waiting message when not paired
                    renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
                    renderer.setScissor(0, 0, window.innerWidth, window.innerHeight);
                    renderer.setScissorTest(false); // Use full viewport

                    // Render using left eye camera as a default single view
                    renderer.render(scene, leftEyeCamera);
                    // Or display a message overlay
                }
            }
        }

        function onWindowResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            if (isDesktop) {
                desktopCamera.aspect = w / h;
                desktopCamera.updateProjectionMatrix();
            } else {
                 // Adjust aspect ratio based on whether paired (stereo) or not (mono)
                const aspect = isPaired ? (w / 2) / h : w / h;
                leftEyeCamera.aspect = aspect;
                rightEyeCamera.aspect = aspect; // Keep right eye aspect consistent even if not rendered mono
                leftEyeCamera.updateProjectionMatrix();
                rightEyeCamera.updateProjectionMatrix();
            }

            renderer.setSize(w, h);
        }

        function updateInfo(message) {
            document.getElementById('info').innerText = message;
            console.log("Info:", message); // Also log to console for debugging
        }

        // Initialize application
        init().catch(err => {
            console.error("Initialization failed:", err);
            updateInfo("Initialization failed. Check console.");
        });
    </script>
